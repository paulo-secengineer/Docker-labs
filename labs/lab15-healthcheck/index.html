<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Healthcheck | Lab #15</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .health-status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            padding: 8px 20px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .pulse {
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(34, 197, 94, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 1rem 0;
            color: var(--primary);
        }

        p {
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .spec-item b { color: var(--primary); }

        .author {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-dim);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="health-status">
            <div class="pulse"></div>
            SYSTEM ONLINE & HEALTHY
        </div>
        <h1>Docker Lab #15</h1>
        <p>Monitoramento automático de integridade via <strong>Healthcheck</strong> em servidor Nginx (Ubuntu 22.04).</p>
        
        <div class="specs">
            <div class="spec-item">Interval: <b>5s</b></div>
            <div class="spec-item">Retries: <b>3x</b></div>
            <div class="spec-item">Port: <b>80</b></div>
            <div class="spec-item">Tool: <b>Curl</b></div>
        </div>

        <div class="author">
            Engenheiro responsável: <strong>Paulo Austríaco</strong><br>
            DevOps & Cloud Infrastructure
        </div>
    </div>
</body>
</html>
